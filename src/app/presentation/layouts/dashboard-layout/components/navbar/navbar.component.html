<header class="h-16 bg-white border-b border-app-border flex items-center justify-between px-8 flex-shrink-0 z-10">
  <!-- Izquierda: Breadcrumb / Título -->
  <div class="flex items-center gap-4">
    <div class="flex items-center text-sm">
      <span class="text-text-muted">Plataforma</span>
      <span class="mx-2 text-text-muted">/</span>
      <span class="font-semibold text-text-main">Kelly Academy</span>
    </div>

    <!-- Indicador de estado en tiempo real -->
    <div class="hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-medium border border-emerald-200">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>En línea</span>
    </div>
  </div>

  <!-- Derecha: Búsqueda, Notificaciones y Acciones -->
  <div class="flex items-center gap-3">
    <!-- Buscador estilo Shadcn Command -->
    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl border border-app-border bg-[#FBFBFA] text-text-secondary text-xs w-64 hover:border-text-muted transition-colors">
      <svg class="w-3.5 h-3.5 text-text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" x2="21" y1="21" y2="16.65" />
      </svg>
      <span class="text-text-muted flex-1">Buscar lección o tarea...</span>
      <kbd class="px-1.5 py-0.5 rounded bg-white border border-app-border text-[10px] text-text-muted font-mono shadow-2xs">⌘K</kbd>
    </div>

    <!-- Botón de Notificaciones -->
    <button
      class="relative w-9 h-9 rounded-xl border border-app-border bg-white flex items-center justify-center text-text-secondary hover:text-text-main hover:bg-[#FAF9F6] transition-colors shadow-2xs"
      title="Notificaciones"
    >
      <svg class="w-4 h-4 stroke-[1.8]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
      </svg>
      <!-- Punto rojo/naranja de aviso -->
      <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-primary ring-2 ring-white"></span>
    </button>

    <!-- Separador vertical -->
    <div class="h-6 w-px bg-app-border"></div>

    <!-- Mini Perfil en Navbar -->
    <div class="flex items-center gap-2.5 pl-1">
      <div class="w-8 h-8 rounded-full bg-primary-soft text-accent-dark font-bold text-xs flex items-center justify-center border border-primary/20">
        {{ userInitials() }}
      </div>
      <div class="hidden lg:flex flex-col text-left">
        <span class="text-xs font-semibold text-text-main leading-tight">{{ currentUser()?.fullName || 'Usuario' }}</span>
        <span class="text-[10px] text-primary font-medium">{{ roleLabel() }}</span>
      </div>
    </div>
  </div>
</header>
